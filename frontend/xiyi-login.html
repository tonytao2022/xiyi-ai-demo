<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>兮易AI智体 · 登录</title>
<style>
:root {
  --bg: #0f172a; --bg-card: #1e293b; --bg-input: #1a2235;
  --text: #e2e8f0; --text-muted: #64748b; --text-bright: #f1f5f9;
  --border: #1e2d4a; --color-primary: #3b82f6; --color-error: #ef4444;
  --color-safety: #22c55e; --radius: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family: -apple-system,'Segoe UI','Noto Sans SC',sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 24px;
}
.login-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 40px; width: 100%; max-width: 420px;
}
.logo { text-align: center; margin-bottom: 32px; }
.logo h1 { font-size: 24px; color: var(--text-bright); margin-bottom: 4px; }
.logo p { font-size: 13px; color: var(--text-muted); }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
.form-group input {
  width: 100%; padding: 12px 16px; background: var(--bg-input);
  border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); font-size: 15px; outline: none; transition: border-color .2s;
}
.form-group input:focus { border-color: var(--color-primary); }
.btn-login {
  width: 100%; padding: 12px; background: var(--color-primary);
  border: none; border-radius: var(--radius); color: #fff;
  font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity .2s;
}
.btn-login:hover { opacity: .9; }
.btn-login:disabled { opacity: .5; cursor: not-allowed; }
.error-msg { color: var(--color-error); font-size: 13px; text-align: center; margin-top: 12px; min-height: 20px; }
.success-msg { color: var(--color-safety); font-size: 13px; text-align: center; margin-top: 12px; }
.footer { text-align: center; margin-top: 24px; font-size: 12px; color: var(--text-muted); }
.footer a { color: var(--color-primary); text-decoration: none; }
.demo-hint { margin-top: 20px; padding: 12px; background: var(--bg); border-radius: var(--radius); font-size: 12px; color: var(--text-muted); text-align: center; }
.demo-hint code { color: var(--color-primary); }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <h1>🏭 兮易AI智体</h1>
    <p>企业经营AI大脑 · 品质专员平台</p>
  </div>
  <form id="loginForm" onsubmit="return handleLogin(event)">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" id="username" placeholder="admin 或 zhangpin" value="admin" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="输入密码" value="admin123" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">登 录</button>
    <div class="error-msg" id="errorMsg"></div>
  </form>
  <div class="demo-hint">
    🧪 演示账号: <code>admin</code> / <code>admin123</code> (全权限) &nbsp;|&nbsp;
    <code>zhangpin</code> / <code>admin123</code> (品质专员)
  </div>
  <div class="footer">
    &copy; 2026 兮易 · <a href="http://43.128.119.244/xiyi-index.html">返回首页</a>
  </div>
</div>

<script>
const API_BASE = '/api/v1/xiyi';

async function handleLogin(e) {
  e.preventDefault();
  var btn = document.getElementById('loginBtn');
  var err = document.getElementById('errorMsg');
  btn.disabled = true;
  btn.textContent = '登录中...';
  err.textContent = '';

  var user = document.getElementById('username').value.trim();
  var pass = document.getElementById('password').value;

  try {
    var resp = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    var data = await resp.json();

    if (data.code === 0 && data.data) {
      // 保存token
      localStorage.setItem('xiyi_access_token', data.data.access_token);
      localStorage.setItem('xiyi_refresh_token', data.data.refresh_token);
      localStorage.setItem('xiyi_user', JSON.stringify(data.data.user));
      localStorage.setItem('xiyi_token_expires', Date.now() + data.data.expires_in * 1000);

      err.className = 'success-msg';
      err.textContent = '✅ 登录成功，正在跳转...';

      // 跳转到来源页或首页
      var from = new URLSearchParams(window.location.search).get('from') || '/xiyi-index.html';
      setTimeout(function() { window.location.href = from; }, 800);
    } else {
      err.className = 'error-msg';
      err.textContent = '❌ ' + (data.error || '登录失败');
    }
  } catch(e) {
    err.className = 'error-msg';
    err.textContent = '❌ 网络错误: ' + e.message;
  }

  btn.disabled = false;
  btn.textContent = '登 录';
}
</script>
</body>
</html>
