<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>根因诊断 · 兮易AI大脑</title>
<style>
:root{--bg-primary:#0a0e17;--bg-secondary:#111827;--bg-card:#161d2a;--border-color:#1e2d4a;--text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-muted:#64748b;--color-hold:#3b82f6;--color-bear:#22c55e;--color-defect:#ef4444;--color-warning:#f59e0b;--radius:8px;--radius-lg:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.7;padding:20px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:8px}
.header h1{font-size:18px;color:#fff}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:var(--radius);font-size:12px;cursor:pointer;text-decoration:none;border:1px solid var(--border-color);color:var(--text-secondary);background:transparent;transition:all .2s}
.btn:hover{border-color:var(--color-hold);color:var(--color-hold)}
.btn-primary{background:var(--color-hold);color:#fff;border:none}
.btn-primary:hover{background:#2563eb}
.wizard{margin-bottom:20px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);overflow:hidden}
.wizard-header{padding:14px 18px;border-bottom:1px solid var(--border-color);font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.steps{display:flex;padding:12px 16px;gap:4px;overflow-x:auto}
.step-item{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;font-size:12px;white-space:nowrap;background:var(--bg-secondary);color:var(--text-secondary);cursor:pointer;border:1px solid transparent;transition:all .2s}
.step-item:hover{border-color:var(--color-hold)}
.step-item.active{background:rgba(59,130,246,0.15);color:var(--color-hold);border-color:var(--color-hold)}
.step-item .num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:rgba(59,130,246,0.2);color:var(--color-hold);flex-shrink:0}
.step-item.active .num{background:var(--color-hold);color:#fff}
.step-item.done{background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.3);color:var(--color-bear)}
.step-item.done .num{background:var(--color-bear);color:#fff}
.content-area{padding:16px 18px}
.content-area h2{font-size:16px;margin-bottom:12px}
.content-area h3{font-size:14px;margin:12px 0 8px;color:var(--text-secondary)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius);padding:12px}
.card .label{font-size:11px;color:var(--text-muted);margin-bottom:4px}
.card .val{font-size:18px;font-weight:700}
.card .desc{font-size:12px;color:var(--text-secondary);margin-top:4px}
.m1e-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.factor{padding:8px 10px;background:var(--bg-primary);border:1px solid var(--border-color);border-radius:var(--radius);font-size:12px;color:var(--text-secondary)}
.step-panel{display:none}
.step-panel.active{display:block}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
th{padding:6px 8px;border-bottom:2px solid var(--border-color);color:var(--text-muted);text-align:left;font-size:11px}
td{padding:5px 8px;border-bottom:1px solid rgba(30,45,74,0.4);color:var(--text-secondary)}
tr:hover td{background:rgba(59,130,246,0.03)}
.loading{text-align:center;padding:40px;color:var(--text-muted)}
@media(max-width:768px){.grid-2,.m1e-grid{grid-template-columns:1fr}.steps{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1 id="pageTitle">🔍 加载中...</h1>
    <div style="font-size:13px;color:var(--text-secondary);margin-top:4px" id="sceneDesc"></div>
  </div>
  <div>
    <a href="/xiyi-quality-workbench.html" class="btn">← 返回工作台</a>
  </div>
</div>

<div class="wizard">
  <div class="wizard-header">
    <span>⚙️ AI根因诊断向导</span>
    <span style="font-size:11px;color:var(--text-muted)" id="stepCounter">加载步骤中...</span>
  </div>
  <div class="steps" id="stepTabs"></div>
</div>

<div id="stepContent">
  <div class="loading" id="loadingMsg">📡 正在加载场景数据...</div>
</div>

<script>
var API = '/api/v1/xiyi';
var _sceneId = parseInt(new URLSearchParams(window.location.search).get('scene')) || 1;
var _traceId = new URLSearchParams(window.location.search).get('trace') || '';
var _sceneName = '';
var _steps = [];

// === 场景数据加载 (Antony P1-6: 从API动态加载) ===
async function init() {
  try {
    // 加载场景信息
    var sr = await fetch(API + '/scenes/' + _sceneId).then(function(r) { return r.json(); });
    if (sr.code !== 0) { document.getElementById('pageTitle').textContent = '❌ ' + sr.error; return; }
    var scene = sr.data.scene;
    _sceneName = scene.scene_name || '';
    document.getElementById('pageTitle').textContent = '🔍 ' + _sceneName + ' — 根因诊断';
    document.getElementById('sceneDesc').textContent = (scene.description || '').slice(0, 120);

    // 加载步骤
    var stepsR = await fetch(API + '/scenes/' + _sceneId + '/steps').then(function(r) { return r.json(); });
    _steps = (stepsR.code === 0) ? (stepsR.data.steps || []) : [];

    // 生成步骤导航
    var tabsHtml = '';
    var contentHtml = '';
    _steps.forEach(function(s, i) {
      var n = i + 1;
      tabsHtml += '<div class="step-item' + (i === 0 ? ' active' : '') + '" data-step="' + n + '" onclick="switchStep(' + n + ')">' +
        '<span class="num">' + n + '</span>' + (s.step_name || '步骤' + n) + '</div>';
      contentHtml += '<div class="step-panel' + (i === 0 ? ' active' : '') + '" id="step' + n + '">' +
        '<div class="content-area"><div class="loading">📡 加载' + (s.step_name || '步骤' + n) + '数据...</div></div></div>';
    });

    document.getElementById('stepTabs').innerHTML = tabsHtml;
    document.getElementById('stepContent').innerHTML = contentHtml;
    document.getElementById('stepCounter').textContent = '步骤 1 / ' + _steps.length;

    // 加载KPI数据填充步骤1
    await loadStep1Data();
    document.getElementById('loadingMsg').style.display = 'none';

    // 如果有traceId，自动触发AI分析
    if (_traceId) {
      loadAiResult();
    }
  } catch(e) {
    document.getElementById('pageTitle').textContent = '❌ 加载失败: ' + e.message;
  }
}

async function loadStep1Data() {
  try {
    var kpiR = await fetch(API + '/mock/kpi').then(function(r) { return r.json(); });
    var mockR = await fetch(API + '/mock/' + _sceneId + '?limit=10').then(function(r) { return r.json(); });

    var kpis = (kpiR.code === 0) ? (kpiR.data.kpis || []) : [];
    var rows = (mockR.code === 0) ? (mockR.data.rows || []) : [];

    var el = document.getElementById('step1');
    if (!el) return;

    // KPI卡片
    var kpiCards = kpis.map(function(k) {
      var icon = k.level === 'danger' ? '🔴' : k.level === 'warning' ? '🟡' : '🟢';
      return '<div class="card"><div class="label">' + k.name + '</div><div class="val" style="color:var(--color-' + (k.level === 'danger' ? 'defect' : k.level === 'warning' ? 'warning' : 'bear') + ')">' + k.value + '</div><div class="desc">目标: ' + k.target + '</div></div>';
    }).join('');

    // 表格数据
    var tableRows = rows.slice(0, 10).map(function(r) {
      var d = r.data || {};
      var fpy = d.fpy || '-';
      var color = parseFloat(fpy) < 97 ? 'color:var(--color-defect)' : parseFloat(fpy) < 98.5 ? 'color:var(--color-warning)' : '';
      return '<tr><td>' + (r.mock_date || '-') + '</td><td>' + (d.line_name || '-') + '</td><td style="' + color + '">' + fpy + '</td><td>' + (d.total || '-') + '</td><td>' + (d.defect || '-') + '</td><td>' + (d.defect_type || '-') + '</td></tr>';
    }).join('');

    el.innerHTML = '<div class="content-area"><h2>📋 问题定义与数据</h2>' +
      '<div class="grid-2">' + kpiCards + '</div>' +
      '<h3>📊 最新' + rows.length + '条数据记录</h3>' +
      '<table><tr><th>日期</th><th>产线</th><th>FPY%</th><th>检验数</th><th>不良数</th><th>主要不良</th></tr>' +
      (tableRows || '<tr><td colspan="6" style="color:var(--text-muted)">暂无数据</td></tr>') +
      '</table></div>';
  } catch(e) {
    var el = document.getElementById('step1');
    if (el) el.innerHTML = '<div class="content-area"><h2>📋 问题定义与数据</h2><div style="color:var(--color-defect)">数据加载失败: ' + e.message + '</div></div>';
  }
}

// 加载AI分析结果
async function loadAiResult() {
  if (!_traceId) return;
  try {
    var tr = await fetch(API + '/analysis/trace/' + _traceId).then(function(r) { return r.json(); });
    if (tr.code === 0) {
      var task = tr.data.task || {};
      var result = task.result || '';
      if (typeof result === 'string') {
        try { result = JSON.parse(result); } catch(e) {}
      }
      if (result && result.ai_analysis) {
        // 填充到步骤2（现象分析）
        var el = document.getElementById('step2');
        if (el) el.innerHTML = '<div class="content-area"><h2>🤖 AI分析报告</h2><pre style="background:var(--bg-secondary);padding:16px;border-radius:var(--radius);font-size:13px;color:var(--text-secondary);white-space:pre-wrap;line-height:1.6;margin-top:8px">' + result.ai_analysis + '</pre></div>';
      }
    }
  } catch(e) {}
}

function switchStep(n) {
  document.querySelectorAll('.step-item').forEach(function(el) { el.classList.remove('active'); });
  var target = document.querySelector('.step-item[data-step="' + n + '"]');
  if (target) target.classList.add('active');
  
  document.querySelectorAll('.step-panel').forEach(function(el) { el.classList.remove('active'); });
  var panel = document.getElementById('step' + n);
  if (panel) panel.classList.add('active');
  
  document.getElementById('stepCounter').textContent = '步骤 ' + n + ' / ' + _steps.length;
  
  for (var i = 1; i < n; i++) {
    var el = document.querySelector('.step-item[data-step="' + i + '"]');
    if (el) el.classList.add('done');
  }
}

init();
</script>
</body>
</html>
