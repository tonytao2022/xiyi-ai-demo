body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0a0e17,#0f1525);color:var(--text-primary);line-height:1.6;padding:20px 28px;min-height:100vh}

.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;text-decoration:none;border:1px solid var(--border-color);color:var(--text-secondary);background:transparent;transition:all .2s}
.btn:hover{border-color:var(--color-hold);color:var(--color-hold);background:rgba(59,130,246,0.06)}
.btn-primary{background:var(--color-hold);color:#fff;border:none}
.btn-primary:hover{background:#2563eb}
.btn-sm{font-size:11px;padding:3px 10px}
.card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;overflow:hidden;margin-bottom:14px;transition:border-color .2s}
.card:hover{border-color:var(--border-light)}
.card-header{padding:12px 18px;border-bottom:1px solid var(--border-color);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;color:var(--text-primary)}

.ai-summary-box h4{font-size:14px;color:var(--color-hold);margin-bottom:6px}

.fpy-tab-item:hover{background:rgba(59,130,246,0.06);color:var(--text-primary)}

.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.report-preview h4{font-size:14px;color:var(--text-primary);margin:14px 0 6px;font-weight:600}

.action-timeline{padding:4px 0}
.action-item{padding:10px 0;border-bottom:1px solid var(--border-color)}
.action-item:last-child{border-bottom:none}
.action-item .action-header{font-size:13px;font-weight:600}

}

function renderTab1(sc) {
  var kpiCards = sc.kpis.map(function(k){
    return '<div class="fpy-kpi-card"><div class="fpy-kpi-title">'+k[0]+'</div><div class="fpy-kpi-value" style="color:'+k[1]+'">'+k[2]+'</div><div class="kpi-trend">'+k[3]+'</div></div>';
  }).join('');
  return '<div id="tab-overview" class="fpy-tab-content active"><div class="grid-4">'+kpiCards+'</div><div class="card"><div class="card-header">'+sc.name+' — 趋势分析 (近30天)</div><div class="card-body" style="padding:10px 14px"><div id="chartContainer" style="width:100%;height:220px"></div><p style="font-size:11px;color:var(--text-muted);margin-top:8px">\ud83d\udce1 \u6570\u636e\u6765\u6e90: MOM\u7cfb\u7edf\u81ea\u52a8\u91c7\u96c6\uff0c\u5ef6\u8fdf\u5c0f\u4e8e5\u5206\u949f</p></div></div></div>';
}

function renderTab2(sc) {
  var bars = sc.defects.map(function(l,i){
    var v = sc.defect_vals[i];
    var c = i < 2 ? 'var(--color-defect)' : i < 4 ? 'var(--color-warning)' : 'var(--border-color)';
    return '<div class="chart-bar"><div class="val">'+v+'%</div><div style="height:'+(v*4)+'px;background:'+c+';border-radius:4px 4px 0 0;width:70%;margin:0 auto"></div><div class="lbl">'+l+'</div></div>';
  }).join('');
  var rows = sc.table_r.map(function(r, i){
    var cls = (i === 0 || i === 2) ? ' class="correlation-critical"' : '';
    var btn = r[6] ? (r[6] === '\u5173\u8054\u5206\u6790' ? '<button class="btn btn-sm btn-primary" onclick="switchTab(\'tab-correlation\')">\u5173\u8054\u5206\u6790</button>' : '<button class="btn btn-sm">\u8be6\u60c5</button>') : '<button class="btn btn-sm">\u8be6\u60c5</button>';
    return '<tr'+cls+'><td>'+r.slice(0,6).join('</td><td>')+'</td><td>'+btn+'</td></tr>';
  }).join('');
  return '<div id="tab-defect-analysis" class="fpy-tab-content"><div class="chart-box"><h5>\u4e0d\u5408\u683c\u9879\u76ee\u7ed3\u6784\u5206\u6790 (\u67cf\u62c9\u56fe)</h5><div class="chart-bar-area">'+bars+'</div></div><div class="card"><div class="card-header">\u4e0d\u5408\u683c\u6279\u6b21\u660e\u7ec6\u6570\u636e (LIMS\u96c6\u6210)</div><div class="card-body" style="overflow-x:auto"><table><tr>'+sc.table_h.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>'+rows+'</table></div></div></div>';
}

function renderTab3(sc) {
  var t1 = '<div class="card"><div class="correlation-header" style="color:var(--color-defect)">'+sc.corr_title1+'</div><div class="card-body"><p style="font-size:11px;color:var(--text-muted);margin-bottom:8px">'+sc.corr_desc1+'</p><div class="grid-2">'+
    '<div><h5>\u5173\u8054\u6570\u636e A</h5><table><tr>'+sc.corr_h1a.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>'+
    sc.corr_r1a.map(function(r){return '<tr><td>'+r.join('</td><td>')+'</td></tr>';}).join('')+'</table></div>'+
    '<div><h5>\u5173\u8054\u6570\u636e B</h5><table><tr>'+sc.corr_h1b.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>'+
    sc.corr_r1b.map(function(r){return '<tr><td>'+r.join('</td><td>')+'</td></tr>';}).join('')+'</table></div></div></div></div>';
  var t2 = sc.corr_title2 ? '<div class="card"><div class="correlation-header" style="color:var(--color-warning)">'+sc.corr_title2+'</div><div class="card-body"><p style="font-size:11px;color:var(--text-muted);margin-bottom:8px">'+(sc.corr_desc2||'')+'</p><div class="grid-2">'+
    '<div><h5>\u5173\u8054\u6570\u636e C</h5><table><tr>'+sc.corr_h2a.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>'+
    sc.corr_r2a.map(function(r){return '<tr><td>'+r.join('</td><td>')+'</td></tr>';}).join('')+'</table></div>'+
    '<div><h5>\u5173\u8054\u6570\u636e D</h5><table><tr>'+sc.corr_h2b.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>'+
    sc.corr_r2b.map(function(r){return '<tr><td>'+r.join('</td><td>')+'</td></tr>';}).join('')+'</table></div></div></div></div>' : '';
  return '<div id="tab-correlation" class="fpy-tab-content"><div class="ai-summary-box"><h4>\ud83e\udd16 AI\u5173\u8054\u6027\u5206\u6790\u6458\u8981</h4><p>'+sc.ai_summary+'</p><ul>'+sc.ai_items.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul></div>'+t1+t2+'</div>';
}

function renderTab4(sc) {
  var capaRows = (sc.capa||[]).map(function(c){
    var cls = 'status-pending';
    if(c[3].indexOf('\u8fdb\u884c')>=0||c[3].indexOf('\u5df2')>=0) cls='status-inprogress';
    if(c[3].indexOf('\u5df2\u5b8c\u6210')>=0) cls='status-completed';
    return '<div class="action-item"><div class="action-header">'+c[0]+'</div><div class="action-meta">\u8d1f\u8d23\u4eba: '+c[1]+' | \u8ba1\u5212\u5b8c\u6210: '+c[2]+'</div><span class="status-badge '+cls+'">'+c[3]+'</span></div>';
  }).join('');
  return '<div id="tab-reporting" class="fpy-tab-content"><div class="grid-2"><div class="card"><div class="card-header">\u5206\u6790\u62a5\u544a (\u81ea\u52a8\u751f\u6210\u9884\u89c8)</div><div class="card-body"><div class="report-preview">'+sc.report+'</div><div class="report-actions"><button class="btn"><span>\u270f\ufe0f</span> \u7f16\u8f91\u62a5\u544a</button><button class="btn btn-primary"><span>\u2b07\ufe0f</span> \u5bfc\u51faPDF/Word</button></div></div></div><div class="card"><div class="card-header">\u6539\u5584\u63aa\u65bd\u8ddf\u8e2a (CAPA)</div><div class="card-body"><div class="action-timeline">'+capaRows+'</div></div></div></div></div>';
}

// Canvas折线图
function drawChart(sc) {
  var el = document.getElementById('chartContainer');
  if (!el) return;
  var canvas = document.createElement('canvas');
  canvas.style.cssText = 'width:100%;height:100%;display:block';
  el.innerHTML = '';
  el.appendChild(canvas);
  
  setTimeout(function(){
    var dpr = window.devicePixelRatio || 1;
    var w = el.clientWidth || 600, h = 220;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    
    var padL = 20, padR = 12, padT = 12, padB = 24;
    var cw = w - padL - padR, ch = h - padT - padB;
    var data = sc.trend, min = sc.trend_min, max = sc.trend_max, range = max - min;
    
    function toX(i) { return padL + (i / (data.length-1)) * cw; }
    function toY(v) { return padT + ch - ((v - min) / range) * ch; }
    
    // 参考线
    [99.0, 98.5, 98.0, 97.5, 97.0, 96.5].forEach(function(v){
      if(v > max || v < min) return;
      var y = toY(v);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL+cw, y);
      ctx.strokeStyle = 'rgba(30,45,74,0.4)'; ctx.lineWidth = 0.5; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#64748b'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(v.toFixed(1), padL - 5, y + 3);
    });
    // 面积
    ctx.beginPath(); ctx.moveTo(toX(0), toY(data[0]));
    for(var i=1;i<data.length;i++) ctx.lineTo(toX(i), toY(data[i]));
    ctx.lineTo(toX(data.length-1), toY(min)); ctx.lineTo(toX(0), toY(min)); ctx.closePath();
    var grad = ctx.createLinearGradient(0, padT, 0, padT+ch);
    grad.addColorStop(0, 'rgba(59,130,246,0.10)'); grad.addColorStop(1, 'rgba(59,130,246,0.01)');
    ctx.fillStyle = grad; ctx.fill();
    // 折线
    ctx.beginPath(); ctx.moveTo(toX(0), toY(data[0]));
    for(var i=1;i<data.length;i++) ctx.lineTo(toX(i), toY(data[i]));
    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
    // 数据点
    for(var i=0;i<data.length;i++){
      var x=toX(i), y=toY(data[i]);
      var c = '#22c55e'; if(data[i] < 97.2) c='#ef4444'; else if(data[i] < 98.0) c='#f59e0b';
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fillStyle = c; ctx.fill();
      ctx.strokeStyle = '#0a0e17'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    // X轴标签
    ctx.fillStyle = '#64748b'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
    [0,5,10,15,20,25,29].forEach(function(idx){ ctx.fillText('D'+(idx+1), toX(idx), h - padB + 16); });
    ctx.save(); ctx.translate(10, padT+ch/2); ctx.rotate(-Math.PI/2);
    ctx.fillStyle = '#64748b'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('%', 0, 0); ctx.restore();
  }, 50);
}
